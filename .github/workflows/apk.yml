name: Compilar APK CAM3D
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android_src.bundle', 'app.js', 'index.html', 'core.js', 'modeler.js', 'ai.js', 'native.js', '.github/workflows/apk.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Firma de prueba
        run: |
          if [ ! -f ci/prueba.keystore ]; then
            mkdir -p ci
            keytool -genkeypair -keystore ci/prueba.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CAM3D Prueba, O=Tectonica Studio"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ci/prueba.keystore
            git commit -m "Firma de prueba del APK [skip ci]"
            git push
          fi
      - name: Armar proyecto
        run: |
          set -e
          python3 - <<'PY'
          import os
          txt = open('android_src.bundle', encoding='utf-8').read()
          for part in txt.split('=====FILE ')[1:]:
              name, body = part.split('\n', 1)
              p = os.path.join('build/CAM3D_Android', name.strip())
              os.makedirs(os.path.dirname(p), exist_ok=True)
              open(p, 'w', encoding='utf-8').write(body)
          PY
          P=build/CAM3D_Android; W=$P/app/src/main/assets/www
          mkdir -p $P/ci && cp ci/prueba.keystore $P/ci/
          mkdir -p $W/lib/three/build $W/lib/three/examples/jsm $W/lib/three-mesh-bvh $W/lib/three-bvh-csg
          cp index.html app.js core.js modeler.js ai.js native.js logo.webp emblem-256.png icon-192.png icon-512.png icon-maskable-512.png manifest.webmanifest $W/
          mkdir -p npm && cd npm && npm pack three@0.160.0 three-mesh-bvh@0.7.8 three-bvh-csg@0.0.16 >/dev/null
          for f in *.tgz; do mkdir -p "${f%.tgz}" && tar xzf "$f" -C "${f%.tgz}"; done
          cd ..
          cp npm/three-0.160.0/package/build/three.module.js $W/lib/three/build/
          for d in controls exporters loaders utils; do cp -r npm/three-0.160.0/package/examples/jsm/$d $W/lib/three/examples/jsm/; done
          cp -r npm/three-mesh-bvh-0.7.8/package/src $W/lib/three-mesh-bvh/
          cp -r npm/three-bvh-csg-0.0.16/package/src $W/lib/three-bvh-csg/
          python3 - "$W/index.html" <<'PY'
          import re, json, sys
          p = sys.argv[1]; h = open(p, encoding='utf-8').read()
          m = re.search(r'<script type="importmap">(.*?)</script>', h, re.S); im = json.loads(m.group(1))
          im['imports'] = {"three": "./lib/three/build/three.module.js", "three/addons/": "./lib/three/examples/jsm/", "three-mesh-bvh": "./lib/three-mesh-bvh/src/index.js", "three-bvh-csg": "./lib/three-bvh-csg/src/index.js"}
          h = h[:m.start(1)] + json.dumps(im, separators=(',', ':')) + h[m.end(1):]
          open(p, 'w', encoding='utf-8').write(h)
          PY
          command -v convert >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick)
          for s in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do d=${s%%:*}; n=${s##*:}; mkdir -p $P/app/src/main/res/mipmap-$d; convert icon-512.png -resize ${n}x${n} $P/app/src/main/res/mipmap-$d/ic_launcher.png; done
          du -sh $W
      - name: Compilar
        run: |
          cd build/CAM3D_Android
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/CAM3D_TectonicaStudio_V3.0.apk
      - name: Publicar descarga
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v3.0 -y --cleanup-tag || true
          gh release create v3.0 CAM3D_TectonicaStudio_V3.0.apk --title "CAM3D v3.0 (app local)" --notes "CAM3D v3.0 · Tectónica Studio. Todos los derechos reservados."
